name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-14
    defaults:
      run:
        working-directory: slipstream
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: slipstream/package-lock.json
      - run: npm ci
      - run: npm run check:preview-notarization
      - run: npm audit --audit-level=high
      - run: npm run check:package-config
      - run: npm run setup:formula-models
      - name: Check reading interface regressions
        run: npm run check:window-policy && npm run check:term-library-layout && npm run check:reading-presentation
      - run: npm test
      - if: ${{ !cancelled() }}
        run: npm run lint
      - if: ${{ !cancelled() }}
        run: npm run build:renderer
      - if: ${{ !cancelled() }}
        run: xcrun swiftc -typecheck scripts/VisionOCR.swift
      - if: ${{ !cancelled() }}
        run: npm run check:formula-ocr
